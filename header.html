<header class="site-header" role="banner">
  <!-- SVG sprite (hidden) — used by menu chevrons -->
  <svg style="display: none" aria-hidden="true">
    <symbol id="icon-chevron" viewBox="0 0 24 24">
      <polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" />
    </symbol>
  </svg>
  <div class="header-inner container">
    <a href="index.html" class="logo" aria-label="На главную">
      <span>Криницы Беларуси</span>
    </a>

    <nav class="main-nav" role="navigation" aria-label="Главная навигация">
      <!-- Desktop menu (generated by js/menu-data.js) -->
      <ul class="main-menu"></ul>

      <!-- Кнопка бургер -->
      <button
        class="burger"
        id="burger-btn"
        aria-label="Открыть меню"
        aria-expanded="false"
        aria-controls="mobile-nav"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
  </div>

  <!-- Мобильное меню -->
  <div id="mobile-nav" class="mobile-nav" aria-hidden="true">
    <!-- Затемнённый фон -->
    <div class="mobile-nav-overlay" id="mobile-overlay"></div>

    <!-- Боковая панель -->
    <div class="mobile-nav-inner">
      <div class="mobile-nav-header">
        <span class="mobile-nav-title">Навигация</span>
      </div>

      <!-- Menu generated by js/menu.js -->
      <ul class="mobile-menu"></ul>
    </div>
  </div>
</header>
